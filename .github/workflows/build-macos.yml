name: Build macOS Desktop App

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64] # arm64 = Apple Silicon (M1/M2/M3/M4), x64 = Intel

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo Workspaces (Shared, Client, Server)
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Package macOS App Bundle (${{ matrix.arch }})
        run: |
          npx nativefier "http://127.0.0.1:39281/" \
            --name "InternalAPI" \
            --platform mac \
            --arch ${{ matrix.arch }} \
            --background-color "#030712" \
            --width 1280 \
            --height 800 \
            --overwrite

      - name: Bundle Standalone Server & Patch Main
        run: node scripts/patch-main.js

      - name: Create DMG & ZIP Installers
        run: |
          APP_PATH=$(find . -name "InternalAPI.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: InternalAPI.app not found!"
            exit 1
          fi
          echo "Found application bundle at: $APP_PATH"

          # 1. Ensure Mach-O executable permissions
          chmod -R +x "$APP_PATH/Contents/MacOS/InternalAPI"

          # 2. Ad-hoc re-sign entire application bundle (required on macOS arm64 after file injection)
          codesign --force --deep -s - "$APP_PATH"

          # 3. Create DMG staging folder with Applications drag-and-drop symlink
          mkdir dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications

          # 4. Create standard macOS DMG disk image
          hdiutil create -volname "InternalAPI" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "InternalAPI-macOS-${{ matrix.arch }}.dmg"

          # 5. Create ZIP archive preserving Apple resource forks & executable flags
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "InternalAPI-macOS-${{ matrix.arch }}.zip"

          # 6. Create OTA UI bundle (~350 KB)
          tar -czvf ui-bundle.tar.gz -C packages/client/dist .

          echo "Packages created successfully:"
          ls -lh InternalAPI-macOS-${{ matrix.arch }}.* ui-bundle.tar.gz

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InternalAPI-macOS-${{ matrix.arch }}
          path: |
            InternalAPI-macOS-${{ matrix.arch }}.dmg
            InternalAPI-macOS-${{ matrix.arch }}.zip
            ui-bundle.tar.gz
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            InternalAPI-macOS-${{ matrix.arch }}.dmg
            InternalAPI-macOS-${{ matrix.arch }}.zip
            ui-bundle.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: internalapi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-internalapi}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internalapi-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3001}
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@db:5432/${DB_NAME:-internalapi}?schema=public"
      INTERNALAPI_SECRET_KEY: ${INTERNALAPI_SECRET_KEY:-internalapi-super-secure-master-encryption-key-32chars}
      JWT_SECRET: ${JWT_SECRET:-internalapi-jwt-secret-key-change-this-in-production-random-64-chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@internalapi.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      ADMIN_NAME: ${ADMIN_NAME:-InternalAPI Admin}
      SSRF_ALLOW_INTERNAL: ${SSRF_ALLOW_INTERNAL:-true}
    volumes:
      - app_data:/app/.data

volumes:
  postgres_data:
  app_data:
